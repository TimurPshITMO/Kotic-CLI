[project]
name = "kotic_cli"
version = "0.1.0"
description = "A local-first AI coding assistant named Kotic CLI."
authors = [
    {name = "annoying_rusk"},
]
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "agno",
    "python-dotenv",
    "openai", # Оставляем, так как agno.models.openai.like.OpenAILike может его использовать
    # Зависимости для будущих этапов
    "textual",
    "pygithub",
    "gitpython",
    "sqlalchemy",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "httpx",
    "asyncio"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kotic_cli"]
